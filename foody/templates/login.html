{% extends "base.html" %}
{% block body %}


    <!-- Page Header Start -->
    <div class="container-fluid page-header wow fadeIn" data-wow-delay="0.1s">
        <div class="container">
            <h1 class="display-3 mb-3 animated slideInDown">Login</h1>
            <nav aria-label="breadcrumb animated slideInDown">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a class="text-body" href="/">Home</a></li>
                
                    <li class="breadcrumb-item text-dark active" aria-current="page">Login</li>
                </ol>
            </nav>
        </div>
    </div>
    <!-- Page Header End -->

    <!-- Login Start -->
    <div class="container-xxl py-6">
        <div class="container">

            <div class="section-header text-center mx-auto mb-5 wow fadeInUp" data-wow-delay="0.1s" style="max-width: 500px;">
                <h1 class="display-5 mb-3">Login</h1>
                <p>Login to access the Food Delivery Time Prediction system.</p>
            </div>

            <div class="row g-5 justify-content-center">

                <!-- CENTERED FORM -->
                <div class="col-lg-6 col-md-10 wow fadeInUp" data-wow-delay="0.3s">

                    <div class="bg-light p-5 rounded">

                        <form action="/login" method="POST">
                            <div class="row g-3">

                                <!-- Email -->
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="email" class="form-control" id="email" placeholder="Email" name="email" required>
                                        <label for="email">Email Address</label>
                                    </div>
                                </div>

                                <!-- Password -->
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="password" placeholder="Password" name="password" required>
                                        <label for="password">Password</label>
                                    </div>
                                </div>

                                <!-- Login Button -->
                                <div class="col-12 text-center">
                                    <button class="btn btn-primary rounded-pill py-3 px-5" type="submit">
                                        Login
                                    </button>
                                </div>

                                <!-- Register Link -->
                                <div class="col-12 text-center">
                                    <p class="mt-3 mb-0">
                                        Don't have an account?
                                        <a href="/register" class="text-primary">Register here</a>
                                    </p>
                                </div>

                            </div>
                        </form>

                    </div>

                </div>

            </div>
        </div>
    </div>
    <!-- Login End -->

   


{% endblock body %}
